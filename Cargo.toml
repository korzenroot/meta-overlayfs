[package]
name = "meta-overlayfs"
version = "1.3.1"
edition = "2024"
authors = ["KernelSU Developers"]
description = "An implementation of a metamodule using OverlayFS for KernelSU"
license = "GPL-3.0"

[dependencies]
anyhow = "1"
log = "0.4"
env_logger = { version = "0.11", default-features = false }
hole-punch = { git = "https://github.com/tiann/hole-punch" }

[target.'cfg(target_os = "android")'.dependencies]
rustix = { git = "https://github.com/KernelSU-Next/rustix.git", features = ["all-apis"] }
procfs = "0.17"

[profile.release]
strip = true
opt-level = "z"       # Minimize binary size
lto = true            # Link-time optimization
codegen-units = 1     # Maximum optimization
panic = "abort"       # Reduce binary size
